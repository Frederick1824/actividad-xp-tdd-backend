openapi: 3.1.0
info:
  title: API Backend - Pedidos con Prisma
  version: 3.0.0
  description: API de ejemplo para procesar pedidos con Express, TypeScript, PostgreSQL y Prisma ORM.
servers:
  - url: http://localhost:3000
    description: Servidor local
paths:
  /api/pedidos:
    post:
      summary: Procesar un pedido
      description: Crea un pedido y descuenta stock dentro de una transacción de Prisma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedidoDto'
            example:
              usuarioId: 1
              productosComprados:
                - productoId: 1
                  cantidad: 2
                - productoId: 2
                  cantidad: 1
      responses:
        '201':
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pedido'
              example:
                data:
                  id: 1
                  usuarioId: 1
                  total: '115000.00'
                  creadoEn: '2026-09-14T19:17:15.683Z'
                  usuario:
                    id: 1
                    nombre: Federico
                    email: fede@ejemplo.com
                  detalles:
                    - id: 1
                      pedidoId: 1
                      productoId: 1
                      cantidad: 2
                      precioUnit: '45000.00'
                    - id: 2
                      pedidoId: 1
                      productoId: 2
                      cantidad: 1
                      precioUnit: '25000.00'
        '400':
          description: Datos incompletos, productos inválidos o stock insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                datosIncompletos:
                  value:
                    error:
                      code: DATOS_INCOMPLETOS
                      message: usuarioId y productosComprados son obligatorios
                stockInsuficiente:
                  value:
                    error:
                      code: STOCK_INSUFICIENTE
                      message: Stock insuficiente para Teclado mecánico
        '404':
          description: Usuario o producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                usuarioNoEncontrado:
                  value:
                    error:
                      code: USUARIO_NO_ENCONTRADO
                      message: Usuario no encontrado
                productoNoEncontrado:
                  value:
                    error:
                      code: PRODUCTO_NO_ENCONTRADO
                      message: Producto 99 no encontrado
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Ocurrió un error interno
components:
  schemas:
    ProductoComprado:
      type: object
      required:
        - productoId
        - cantidad
      properties:
        productoId:
          type: integer
          minimum: 1
          example: 1
        cantidad:
          type: integer
          minimum: 1
          example: 2
    CrearPedidoDto:
      type: object
      required:
        - usuarioId
        - productosComprados
      properties:
        usuarioId:
          type: integer
          minimum: 1
          example: 1
        productosComprados:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductoComprado'
    Pedido:
      type: object
      properties:
        id:
          type: integer
          example: 1
        usuarioId:
          type: integer
          example: 1
        total:
          type: string
          example: '115000.00'
        creadoEn:
          type: string
          format: date-time
        usuario:
          type: object
          additionalProperties: true
        detalles:
          type: array
          items:
            type: object
            additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
